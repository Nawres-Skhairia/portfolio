  <div class="strip" id="band" role="region" aria-label="About this workspace"></div>
  <header class="topbar">
    <h1 class="sr">Command Center</h1>
    <button type="button" class="ib side-tog" id="sideTog" data-act="side-toggle" aria-controls="sideMenu" aria-expanded="true" aria-label="Close the side menu" title="Close the side menu"><svg class="i" aria-hidden="true"><use href="#i-side"/></svg></button>
    <button type="button" class="ws-btn" id="wsBtn" data-menu="ws" aria-haspopup="menu" aria-expanded="false"><span class="ws-mark" aria-hidden="true"><i></i></span><span class="ws-name" id="wsBox">Orbis Studio</span><svg class="i chev" aria-hidden="true"><use href="#i-down"/></svg></button>
    <button type="button" class="gsearch" data-act="palette" aria-label="Search work, projects and people (Ctrl K)"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span>Search work, projects and people</span><kbd>Ctrl K</kbd></button>
    <span class="grow"></span>
    <span class="save-state top-save" id="topSave" aria-live="polite"></span>
    <button type="button" class="btn create" data-act="new-task" title="Create · C"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Create</button>
    <button type="button" class="ib" data-act="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts · ?"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg></button>
    <button type="button" class="ib me-btn" id="meBtn" data-menu="me" aria-haspopup="menu" aria-expanded="false" aria-label="Your menu"></button>
    <div class="menu-pop" id="menuPop" role="menu" popover="manual" hidden></div>
  </header>
  <div class="app" id="app">
    <aside class="side" id="sideMenu" aria-label="Command Center">
      <nav class="nav" aria-label="Pages" id="sideNav">
        <div id="pinNav" class="nav"></div>
        <div id="mainNav" class="nav"></div>
        <p class="grp" id="projGrp"><span>Projects</span><button type="button" class="grp-add" data-act="new-project" aria-label="New project" title="New project"><svg class="i"><use href="#i-plus"/></svg></button></p>
        <div id="projNav" class="nav"></div>
        <p class="grp"><span>Team</span></p>
        <a class="nv" href="#/workspace" data-nav="workspace"><svg class="i"><use href="#i-people"/></svg>People<i class="ct" id="pplCount"></i></a>
      </nav>
      <div class="foot" id="sideFoot">
        <a class="nv" href="#/admin" data-nav="admin" id="adminNav" hidden><svg class="i"><use href="#i-shield"/></svg>Admin</a>
        <a class="home-link" href="/#work">← Nawres Skhairia</a>
      </div>
    </aside>

    <div class="content">
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" aria-label="Command Center, phone">
    <a class="tab" href="#/overview" data-nav="overview"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
    <a class="tab" href="#/mytasks" data-nav="mytasks"><svg class="i"><use href="#i-check"/></svg><span>My tasks</span></a>
    <a class="tab" href="#/board" data-nav="board"><svg class="i"><use href="#i-board"/></svg><span>Board</span></a>
    <button type="button" class="tab" data-act="palette"><svg class="i"><use href="#i-search"/></svg><span>Search</span></button>
    <button type="button" class="tab" data-act="more" aria-label="More pages" aria-controls="moreSheet"><svg class="i"><use href="#i-more"/></svg><span>More</span><i class="ins-count" hidden></i></button>
  </nav>
  <button type="button" class="fab" data-act="new-task" aria-label="Create task"><svg class="i" style="width:22px;height:22px"><use href="#i-plus"/></svg></button>
  <div class="more-sheet" id="moreSheet" hidden></div>

  <div class="panel-drawer" id="panel" role="complementary" hidden aria-label="Task details"></div>
  <div class="palette" id="palette" hidden></div>
  <dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Command Center needs JavaScript to run.</p></noscript>

  <script type="module" src="app.js"></script>
