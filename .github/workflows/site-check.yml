# Portfolio site check (PORT-27). Advisory for now: a red cross is a warning
# to read before merging, it does not block the merge.
name: Site check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the site
        run: node .github/scripts/site-check.mjs
