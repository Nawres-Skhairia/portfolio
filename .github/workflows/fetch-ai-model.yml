# Test Pilot (PORT-30 step 3): fetch the AI model once so the site can serve it
# itself. Runs only when .github/ai-model.txt changes on the Test Pilot branch,
# never on main. It commits the files back to that same branch.
name: Fetch AI model
on:
  push:
    branches: [claude/project-thread-lur3w9-test-pilot]
    paths: ['.github/ai-model.txt']
permissions:
  contents: write
concurrency: fetch-ai-model
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download and verify
        run: node .github/scripts/fetch-ai-model.mjs
      - name: Commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/test-pilot/ai/model
          git commit -m "Test Pilot: AI model files, fetched and SHA-256 checked by the Fetch AI model workflow" || exit 0
          git push origin HEAD:${{ github.ref_name }}
